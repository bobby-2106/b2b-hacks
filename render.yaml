services:
  - type: web
    name: b2b-hacks-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_config.py app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: b2b-hacks-db
          property: connectionString

databases:
  - name: b2b-hacks-db
    plan: free
